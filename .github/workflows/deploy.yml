name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yara

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt pytest pytest-asyncio httpx

      - name: Validate YARA rules syntax
        run: python -c "
          from backend.scanner.yara_engine import YaraEngine
          e = YaraEngine('./Rules')
          print(f'Compiled {e.rule_count} YARA rule file(s) successfully')
        "

      - name: Run tests
        run: pytest --tb=short -q

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

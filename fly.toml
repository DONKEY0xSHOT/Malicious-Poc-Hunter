# fly.toml - Fly.io deployment configuration
# Deploy with: fly deploy

app = "poc-hunter"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV              = "production"
  DATABASE_PATH    = "/data/poc-hunter.db"
  RULES_DIR        = "/app/Rules"
  FRONTEND_URL     = "https://poc-hunter.fly.dev"
  SCAN_INTERVAL_MINUTES = "30"
  MAX_REPOS_PER_SCAN    = "100"
  MAX_CONCURRENT_DOWNLOADS = "5"

[http_service]
  internal_port       = 8000
  force_https         = true
  auto_stop_machines  = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "256mb"

[[mounts]]
  source      = "poc_hunter_data"
  destination = "/data"
  initial_size = "1gb"

[checks]
  [checks.health]
    grace_period = "30s"
    interval     = "15s"
    method       = "GET"
    path         = "/api/v1/stats"
    port         = 8000
    timeout      = "10s"
    type         = "http"
